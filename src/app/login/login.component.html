<div class="login-container">
    <div class="login-logo-container">
      <img src="assets/img/logotipo.png" alt="Logo" class="login-logo" />
    </div>
    <div class="login-form">
      <div class="login-header">
        <h2>Papigiras LAB</h2>
        <p>Usa la cuenta local del laboratorio.</p>
      </div>
      <form (ngSubmit)="onSubmit()">
        <div class="input-container">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required autocomplete="username" placeholder="Cuenta local">
        </div>
        <div class="input-container">
          <label for="password">Contraseña local del laboratorio</label>
          <input type="password" id="password" name="password" [(ngModel)]="password" required autocomplete="current-password" placeholder="********">
        </div>
        
        <button type="submit" class="login-btn">Ingresar</button>
      </form>
    </div>
  </div>
